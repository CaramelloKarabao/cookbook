<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Companion & Cookbook</title>
  <style>
    :root {
      --bg-color: #fbf9f5;
      --panel-bg: #ffffff;
      --accent: #2e5a44;
      --accent-light: #eaf1eb;
      --accent-hover: #234635;
      --border: #e3ded6;
      --text: #242926;
      --muted: #6a736d;
      --tag-bg: #f1eee7;
      --card-shadow: 0 4px 12px rgba(0,0,0,0.03);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Bar */
    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 10;
    }
    .burger-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .burger-btn span {
      display: block;
      width: 20px;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
    }
    .header-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Drawer Sidebar */
    .drawer-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.35);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    aside {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 320px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      z-index: 101;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      display: flex;
      flex-direction: column;
    }
    aside.open {
      transform: translateX(0);
    }
    .drawer-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drawer-header h2 {
      font-size: 1.15rem;
      color: var(--accent);
    }
    .btn-close {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--muted);
      line-height: 1;
    }
    .nav-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
      list-style: none;
    }
    .nav-group-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--muted);
      padding: 14px 12px 6px;
    }
    .nav-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      margin-bottom: 4px;
      border-radius: 8px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 0.95rem;
      color: var(--text);
      font-weight: 500;
      transition: background 0.15s ease;
    }
    .nav-item:hover { background: var(--accent-light); }
    .nav-item.active { background: var(--accent); color: white; }

    /* Content Area */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px 60px;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
    }
    .view-card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      box-shadow: var(--card-shadow);
      margin-bottom: 20px;
    }
    .view-card h2 {
      font-size: 1.7rem;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .meta-tags {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .tag {
      background: var(--tag-bg);
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 20px;
      color: var(--muted);
      font-weight: 600;
    }

    /* Home Dashboard Widgets */
    .dashboard-hero {
      background: linear-gradient(135deg, var(--accent) 0%, #1e3a2c 100%);
      color: white;
      border-radius: 12px;
      padding: 28px 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(46,90,68,0.15);
    }
    .dashboard-hero h2 {
      color: #fff;
      font-size: 1.75rem;
      margin-bottom: 6px;
    }
    .dashboard-hero p {
      font-size: 0.95rem;
      opacity: 0.9;
    }
    
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    .recipe-tile {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: var(--card-shadow);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .recipe-tile:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .recipe-tile h3 {
      font-size: 1.1rem;
      color: var(--accent);
      margin-bottom: 10px;
      line-height: 1.35;
    }
    .recipe-tile .tile-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .recipe-tile .btn-open {
      color: var(--accent);
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .quick-rules-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 24px;
    }
    .quick-rule-badge {
      background: #faf8f5;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      flex-shrink: 0;
      max-width: 260px;
    }
    .quick-rule-badge strong {
      display: block;
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 2px;
    }
    .quick-rule-badge span {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.3;
      display: block;
    }

    /* Collapsible Sections */
    details.collapsible-section {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 16px;
      background: #ffffff;
      overflow: hidden;
    }
    details.collapsible-section summary {
      padding: 14px 18px;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--accent);
      cursor: pointer;
      user-select: none;
      background: #faf8f5;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    details.collapsible-section summary::-webkit-details-marker { display: none; }
    details.collapsible-section summary::after {
      content: '▾';
      font-size: 1.1rem;
      transition: transform 0.2s ease;
    }
    details.collapsible-section[open] summary::after {
      transform: rotate(180deg);
    }
    .section-body {
      padding: 16px 18px;
      border-top: 1px solid var(--border);
    }

    /* Ingredient Grouped Prep Cards */
    .ingredient-prep-card {
      background: #faf8f5;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .ingredient-prep-card:last-child {
      margin-bottom: 0;
    }
    .ingredient-prep-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    ul.check-list { list-style: none; }
    ul.check-list li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 6px 0;
      font-size: 0.92rem;
      line-height: 1.45;
    }
    ul.check-list input[type="checkbox"] {
      margin-top: 3px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    ul.check-list li.checked label {
      text-decoration: line-through;
      color: var(--muted);
    }
    .rule-card {
      background: #faf8f4;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .rule-card strong {
      display: block;
      color: var(--accent);
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header>
    <button class="burger-btn" onclick="toggleDrawer(true)" aria-label="Open Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="header-title" id="pageTitle">Kitchen Companion</div>
  </header>

  <!-- Slide-out Drawer Navigation -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer(false)"></div>
  <aside id="drawerNav">
    <div class="drawer-header">
      <h2>Cookbook Menu</h2>
      <button class="btn-close" onclick="toggleDrawer(false)">&times;</button>
    </div>
    <ul class="nav-list" id="navList"></ul>
  </aside>

  <!-- Main Content Area -->
  <main>
    <div class="container" id="contentArea"></div>
  </main>

  <!-- Global App State -->
  <script>
    window.cookbookApp = {
      rules: [],
      weeks: []
    };
  </script>

  <!-- Rules File -->
  <script src="rules.js"></script>

  <!-- Weeks Manifest & Dynamic Loader -->
  <script src="manifest.js"></script>
  <script>
    function toggleDrawer(open) {
      document.getElementById('drawerNav').classList.toggle('open', open);
      document.getElementById('drawerOverlay').classList.toggle('open', open);
    }

    let activeView = "home";

    function cleanTitle(title) {
      if (!title) return "";
      return title.replace(/^\d+\.\s*/, '');
    }

    function getLatestWeek() {
      if (!window.cookbookApp.weeks.length) return null;
      return window.cookbookApp.weeks[window.cookbookApp.weeks.length - 1];
    }

    function loadWeekFiles(files) {
      let loaded = 0;
      if (!files.length) {
        initApp();
        return;
      }
      files.forEach(file => {
        const s = document.createElement('script');
        s.src = file;
        s.onload = () => {
          loaded++;
          if (loaded === files.length) initApp();
        };
        document.body.appendChild(s);
      });
    }

    function initApp() {
      activeView = "home";
      renderNav();
      renderContent();
    }

    function renderNav() {
      const nav = document.getElementById("navList");
      nav.innerHTML = `
        <div class="nav-group-title">Navigation</div>
        <button class="nav-item ${activeView === 'home' ? 'active' : ''}" onclick="selectView('home')">🏠 Home Dashboard</button>
        <button class="nav-item ${activeView === 'rules' ? 'active' : ''}" onclick="selectView('rules')">📋 Kitchen Rules & Notes</button>
      `;

      const reversedWeeks = [...window.cookbookApp.weeks].reverse();

      reversedWeeks.forEach(week => {
        const groupHeader = document.createElement("div");
        groupHeader.className = "nav-group-title";
        groupHeader.innerText = week.weekTitle;
        nav.appendChild(groupHeader);

        week.recipes.forEach(r => {
          const btn = document.createElement("button");
          btn.className = `nav-item ${activeView === r.id ? 'active' : ''}`;
          btn.innerText = cleanTitle(r.title);
          btn.onclick = () => selectView(r.id);
          nav.appendChild(btn);
        });
      });
    }

    function selectView(id) {
      activeView = id;
      toggleDrawer(false);
      renderNav();
      renderContent();
    }

    function toggleCheck(id) {
      const el = document.getElementById(id);
      const parent = el.closest('li');
      if (el.checked) {
        parent.classList.add('checked');
        localStorage.setItem('chk_' + id, 'true');
      } else {
        parent.classList.remove('checked');
        localStorage.removeItem('chk_' + id);
      }
    }

    function renderHome() {
      const pageTitle = document.getElementById("pageTitle");
      pageTitle.innerText = "Kitchen Companion";

      const currentWeek = getLatestWeek();

      return `
        <div class="dashboard-hero">
          <h2>Welcome to the Kitchen</h2>
          <p>${currentWeek ? currentWeek.weekTitle : 'No weekly plan loaded'}</p>
        </div>

        <!-- Collapsible Meals Section -->
        <details class="collapsible-section" open>
          <summary>🥘 This Fortnight's Meals (${currentWeek ? currentWeek.recipes.length : 0} Planned)</summary>
          <div class="section-body">
            <div class="grid-cards">
              ${(currentWeek ? currentWeek.recipes : []).map(r => `
                <div class="recipe-tile" onclick="selectView('${r.id}')">
                  <div>
                    <h3>${cleanTitle(r.title)}</h3>
                    <div class="tile-tags">
                      ${r.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                    </div>
                  </div>
                  <div class="btn-open">View Recipe & Steps →</div>
                </div>
              `).join('')}
            </div>
          </div>
        </details>

        <!-- Consolidated Prep Accordion by Ingredient -->
        ${currentWeek && currentWeek.groceryDayPrep ? `
          <details class="collapsible-section" open>
            <summary>🔪 Delivery Day Prep & Storage (By Ingredient)</summary>
            <div class="section-body">
              <p style="font-size: 0.85rem; color: var(--muted); margin-bottom: 16px;">Process and store all fresh ingredients in one go when deliveries arrive:</p>
              
              ${currentWeek.groceryDayPrep.map((group, gIdx) => `
                <div class="ingredient-prep-card">
                  <div class="ingredient-prep-title">📦 ${group.ingredient}</div>
                  <ul class="check-list">
                    ${group.tasks.map((task, tIdx) => {
                      const chkId = `gprep-${gIdx}-${tIdx}`;
                      const isChecked = localStorage.getItem('chk_' + chkId) === 'true';
                      return `
                        <li class="${isChecked ? 'checked' : ''}">
                          <input type="checkbox" id="${chkId}" ${isChecked ? 'checked' : ''} onchange="toggleCheck('${chkId}')">
                          <label for="${chkId}">${task}</label>
                        </li>
                      `;
                    }).join('')}
                  </ul>
                </div>
              `).join('')}
            </div>
          </details>
        ` : ''}

        <h3 style="font-size: 1.05rem; color: var(--accent); margin: 24px 0 10px; font-weight: 700;">
          ⚡ Quick Kitchen Equipment Notes
        </h3>
        <div class="quick-rules-row">
          <div class="quick-rule-badge">
            <strong>Induction Temperatures</strong>
            <span>Simmer (80–100°C) • Sauté (120–140°C) • Fry (160–180°C) • Sear (200–220°C)</span>
          </div>
          <div class="quick-rule-badge">
            <strong>Air Fryer Roasting</strong>
            <span>180–190°C • Shake basket halfway • Single layers for even crisping</span>
          </div>
          <div class="quick-rule-badge">
            <strong>Spring Onions</strong>
            <span>Chop whole bunch upon delivery & freeze in a bag for garnish</span>
          </div>
        </div>
      `;
    }

    function renderContent() {
      const container = document.getElementById("contentArea");
      const pageTitle = document.getElementById("pageTitle");

      if (activeView === 'home') {
        container.innerHTML = renderHome();
        return;
      }

      if (activeView === 'rules') {
        pageTitle.innerText = "Kitchen Rules";
        container.innerHTML = `
          <div class="view-card">
            <h2>Kitchen Rules & Settings</h2>
            <p style="color: var(--muted); margin-bottom: 24px;">Default equipment calibrations and food storage preferences.</p>
            ${(window.cookbookApp.rules || []).map(r => `
              <div class="rule-card">
                <strong>${r.title}</strong>
                <span>${r.rule}</span>
              </div>
            `).join('')}
          </div>
        `;
        return;
      }

      let recipe;
      window.cookbookApp.weeks.forEach(w => {
        const found = w.recipes.find(r => r.id === activeView);
        if (found) recipe = found;
      });

      if (!recipe) return;

      pageTitle.innerText = cleanTitle(recipe.title);

      container.innerHTML = `
        <div class="view-card">
          <h2>${cleanTitle(recipe.title)}</h2>
          <div class="meta-tags">
            ${recipe.tags.map(t => `<span class="tag">${t}</span>`).join('')}
          </div>

          <!-- Section 1: Ingredients -->
          <details class="collapsible-section" open>
            <summary>🛒 Ingredients</summary>
            <div class="section-body">
              <ul class="check-list">
                ${recipe.ingredients.map((item, idx) => {
                  const chkId = `ing-${recipe.id}-${idx}`;
                  const isChecked = localStorage.getItem('chk_' + chkId) === 'true';
                  return `
                    <li class="${isChecked ? 'checked' : ''}">
                      <input type="checkbox" id="${chkId}" ${isChecked ? 'checked' : ''} onchange="toggleCheck('${chkId}')">
                      <label for="${chkId}">${item}</label>
                    </li>
                  `;
                }).join('')}
              </ul>
            </div>
          </details>

          <!-- Section 2: Batch Prep & Storage -->
          <details class="collapsible-section" open>
            <summary>🔪 Meal Prep</summary>
            <div class="section-body">
              <ul class="check-list">
                ${recipe.prep.map((step, idx) => {
                  const chkId = `prep-${recipe.id}-${idx}`;
                  const isChecked = localStorage.getItem('chk_' + chkId) === 'true';
                  return `
                    <li class="${isChecked ? 'checked' : ''}">
                      <input type="checkbox" id="${chkId}" ${isChecked ? 'checked' : ''} onchange="toggleCheck('${chkId}')">
                      <label for="${chkId}">${step}</label>
                    </li>
                  `;
                }).join('')}
              </ul>
            </div>
          </details>

          <!-- Section 3: Cooking Steps -->
          <details class="collapsible-section" open>
            <summary>🍳 Cooking Steps</summary>
            <div class="section-body">
              <ul class="check-list">
                ${recipe.cooking.map((step, idx) => {
                  const chkId = `cook-${recipe.id}-${idx}`;
                  const isChecked = localStorage.getItem('chk_' + chkId) === 'true';
                  return `
                    <li class="${isChecked ? 'checked' : ''}">
                      <input type="checkbox" id="${chkId}" ${isChecked ? 'checked' : ''} onchange="toggleCheck('${chkId}')">
                      <label for="${chkId}">${step}</label>
                    </li>
                  `;
                }).join('')}
              </ul>
            </div>
          </details>
        </div>
      `;
    }

    loadWeekFiles(window.cookbookManifest || []);
  </script>
</body>
</html>
